[project]
name = "smart-note-model-training"
version = "0.1.0"
description = "Offline XLM-RoBERTa concept-status training for the Smart Note service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "safetensors>=0.5,<1",
  "scikit-learn>=1.6,<2",
  "torch>=2.7,<3",
  "transformers>=4.50,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
