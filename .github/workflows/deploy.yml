# --- Build & deploy to Azure Container Apps ---
#
# On every push to main: build the image (coverage bundle and Nomic retrieval
# encoder baked in), push it to ACR tagged with the commit SHA, and roll it out
# to the `smart-notes-service` Container App.
#
# The MiniLM encoder in runtime/coverage/ is stored in Git LFS. LFS objects are
# cached between runs so each build doesn't spend LFS bandwidth.
#
# Auth: OIDC federated credential on the `github-nous-deployer` managed
# identity. Requires the AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID secrets (org level).
#
# Env values live on the Container App and are never touched here.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deployment/**"
      - "data/**"

permissions:
  id-token: write # OIDC login to Azure
  contents: read

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: Nous-Azure
  ACR_NAME: nouscontainerregistry
  ACR_LOGIN_SERVER: nouscontainerregistry-dydgemargghucgcz.azurecr.io
  IMAGE_NAME: smart-notes-service
  NOTES_APP: smart-notes-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS objects
        run: |
          git lfs pull
          git lfs fsck

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy notes service
        run: |
          az containerapp update \
            --name "$NOTES_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            --query "properties.latestRevisionName" -o tsv
