services:
  notes-coverage:
    image: smart-notes-coverage:science-v35-history-v62-ict-v31-materials-v31-ocr-v2-kb-v2
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8004"
      COVERAGE_BUNDLE_DIR: /app/coverage-runtime
      COVERAGE_PYTHON: /opt/coverage-python/bin/python
      # Avoid inheriting machine-specific Python overrides from a developer .env.
      ENGLISH_COVERAGE_PYTHON: /opt/coverage-python/bin/python
      HISTORY_COVERAGE_PYTHON: /opt/coverage-python/bin/python
      ICT_COVERAGE_PYTHON: /opt/coverage-python/bin/python
      UPLOAD_DIR: /app/uploads
      EMBEDDING_CACHE_DIR: /app/.cache/embeddings
      ENGLISH_COVERAGE_SUGGESTIONS_ENABLED: "true"
      HISTORY_COVERAGE_REVIEW_ENABLED: "true"
      ICT_COVERAGE_REVIEW_ENABLED: "true"
      # Respect the configured cloud endpoint; a local override is explicit.
      QDRANT_DB_URL: ${COVERAGE_QDRANT_URL:-${QDRANT_DB_URL:-http://host.docker.internal:6333}}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-pdf_knowledge_base_v2}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_PAYLOAD_PAGE_BASE: ${QDRANT_PAYLOAD_PAGE_BASE:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${COVERAGE_HOST_PORT:-8005}:8004"
    volumes:
      - coverage-uploads:/app/uploads
      - coverage-audio:/app/generated_audio
      - coverage-cache:/app/.cache
volumes:
  coverage-uploads:
  coverage-audio:
  coverage-cache:
