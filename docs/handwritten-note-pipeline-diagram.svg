<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="title desc">
  <title id="title">Curriculum-grounded handwritten note understanding pipeline</title>
  <desc id="desc">A student uploads handwritten note images. The system performs OCR and quality assessment, detects context, retrieves curriculum content, applies hybrid concept matching and coverage calculation, and produces explainable feedback, learning materials, learner profile updates, and a quiz diagnostic request after student confirmation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 14; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .side { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #64748b; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="720" height="680" fill="#ffffff"/>
  <text x="360" y="28" class="title" font-size="20">Curriculum-Grounded Handwritten Note Understanding</text>

  <rect x="230" y="52" width="260" height="64" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="78" class="title">1. Student Note Upload</text>
  <text x="360" y="99" class="body">Single or multi-page note images</text>

  <path d="M360 116 L360 145" class="arrow"/>
  <rect x="198" y="150" width="324" height="76" class="box" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="177" class="title">2. Vision OCR and Quality Processing</text>
  <text x="360" y="199" class="body">Page transcription, cleanup, legibility warning</text>

  <path d="M360 226 L360 255" class="arrow"/>
  <rect x="198" y="260" width="324" height="76" class="box" fill="#fdf4ff" stroke="#a855f7"/>
  <text x="360" y="287" class="title">3. Context Identification</text>
  <text x="360" y="309" class="body">Language, subject, grade, and lesson topic</text>

  <path d="M360 336 L360 365" class="arrow"/>
  <rect x="198" y="370" width="324" height="76" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="360" y="397" class="title">4. Curriculum Retrieval</text>
  <text x="360" y="419" class="body">Lesson outcomes, concepts, weights, textbook passages</text>

  <rect x="20" y="365" width="142" height="86" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="91" y="392" class="side">Centralized KB</text>
  <text x="91" y="413" class="small">Curriculum registry</text>
  <text x="91" y="430" class="small">+ Qdrant textbook vectors</text>
  <path d="M162 408 L193 408" class="dashed"/>

  <path d="M360 446 L360 475" class="arrow"/>
  <rect x="178" y="480" width="364" height="86" class="box" fill="#fefce8" stroke="#ca8a04"/>
  <text x="360" y="507" class="title">5. Hybrid Concept and Coverage Analysis</text>
  <text x="360" y="529" class="body">Keyword evidence + semantic matching</text>
  <text x="360" y="548" class="small">Deterministic weighted and confidence-adjusted coverage</text>

  <path d="M360 566 L360 595" class="arrow"/>
  <rect x="178" y="600" width="364" height="64" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="360" y="626" class="title">6. Explainable Learning Support</text>
  <text x="360" y="647" class="body">Outcome-linked findings, evidence, and recommendations</text>

  <path d="M542 632 L604 632" class="arrow"/>
  <rect x="608" y="580" width="98" height="104" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="657" y="607" class="side">After student</text>
  <text x="657" y="623" class="side">confirms</text>
  <text x="657" y="646" class="small">Targeted materials</text>
  <text x="657" y="662" class="small">Profile + quiz request</text>
</svg>
