name: notes-kb-v2-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes_ingestion
      POSTGRES_DB: notes_ingestion_v2
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set local credentials}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_ingestion -d notes_ingestion_v2"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis:/data"]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: ${LOCAL_QDRANT_API_KEY:?Set local credentials}
    ports: ["127.0.0.1:6335:6333", "127.0.0.1:6336:6334"]
    volumes: ["qdrant:/qdrant/storage"]
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: notes_ingestion
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_PASSWORD:?Set local credentials}
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: ["minio:/data"]
    restart: unless-stopped
volumes:
  postgres:
  redis:
  qdrant:
  minio:
